<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
/* ===== 報酬画面 ===== */

#rewardScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 9999;
  width: 100%;
  height: 100%;
  overflow: hidden;
  text-align: center;
  color: white;
  font-family: sans-serif;
}

#rewardTitle {
  position: relative;
  z-index: 10;
  font-size: clamp(40px, 9vw, 90px);
  font-weight: bold;
  margin-top: 25vh;
  text-shadow: 2px 2px 10px #333;
}

#rewardMessage {
  position: relative;
  z-index: 10;
  font-size: clamp(22px, 5vw, 40px);
  margin-top: 20px;
}

#rewardClose {
  position: absolute;
  z-index: 20;
  bottom: 8%;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 45px;
  font-size: 22px;
  border: none;
  border-radius: 30px;
  background: white;
  color: #333;
  cursor: pointer;
}

/* 花火 */
.reward-firework {
  background: radial-gradient(
    circle at 50% 50%,
    #17245c 0%,
    #05091d 100%
  );
}

/* お花とちょうちょ */
.reward-flower {
  background: linear-gradient(
    to bottom,
    #83d9ff,
    #e5ffd5
  );
  color: #245b32 !important;
}

/* 木枯らし */
.reward-wind {
  background: linear-gradient(
    to bottom,
    #526579,
    #b5bdc5
  );
}
/* ===== 花火アニメーション ===== */

#rewardAnimation {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.firework {
  position: absolute;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  animation: explode 1.5s ease-out forwards;
}

@keyframes explode {

  0% {
    box-shadow: 0 0 0 0 white;
    opacity: 1;
    transform: scale(0.1);
  }

  30% {
    opacity: 1;
  }

  100% {
    box-shadow:
      0 -100px 0 2px #ff4444,
      70px -70px 0 2px #ffff00,
      100px 0 0 2px #00ffff,
      70px 70px 0 2px #ff66ff,
      0 100px 0 2px #ffffff,
      -70px 70px 0 2px #00ff88,
      -100px 0 0 2px #ff9900,
      -70px -70px 0 2px #ffffff;
    opacity: 0;
    transform: scale(1);
  }

}
/* ===== お花とちょうちょのアニメーション ===== */

.flower {
  position: absolute;
  bottom: -80px;
  font-size: 45px;
  animation: flowerRise 6s ease-out forwards;
}

@keyframes flowerRise {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }

  20% {
    opacity: 1;
  }

  100% {
    transform: translateY(-100vh) rotate(360deg);
    opacity: 0;
  }
}

/* ちょうちょ */

.butterfly {
  position: absolute;
  font-size: 40px;
  animation: butterflyFly 7s linear forwards;
}

@keyframes butterflyFly {
  0% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  25% {
    transform: translate(100px, -80px) rotate(15deg);
  }

  50% {
    transform: translate(200px, 30px) rotate(-15deg);
  }

  75% {
    transform: translate(300px, -100px) rotate(15deg);
  }

  100% {
    transform: translate(450px, -40px) rotate(0deg);
    opacity: 0;
  }
} 
 /* ===== 木枯らしアニメーション ===== */

.witheredLeaf {
  position: absolute;
  top: -60px;
  font-size: 35px;
  animation: coldWind 5s linear forwards;
}

@keyframes coldWind {

  0% {
    transform: translate(0, 0) rotate(0deg);
    opacity: 0;
  }

  10% {
    opacity: 1;
  }

  25% {
    transform: translate(100px, 25vh) rotate(120deg);
  }

  50% {
    transform: translate(-50px, 50vh) rotate(240deg);
  }

  75% {
    transform: translate(150px, 75vh) rotate(360deg);
  }

  100% {
    transform: translate(-100px, 110vh) rotate(540deg);

}

/* 木枯らしのタイトル */

.reward-wind #rewardTitle {
  color: #ffffff;
  text-shadow:
    2px 2px 5px #35465a,

}

.reward-wind #rewardMessage {
  color: #ffffff;

</head>

<body>
<body>
  <h2>受験者情報</h2>

クラス
<input id="studentClass" oninput="checkHalfWidth(this)">

出席番号
<input id="studentNumber" oninput="checkHalfWidth(this)">

氏名
<input id="studentName"><br><br>

<hr>

<h1>さあ音読！君のスコアは？ </h1>

<h3 id="question">
読み込み中...
</h3>


<button id="recordButton" onclick="startRecognition()">
録音開始
</button>
  
<p id="timer">残り時間：--:--</p>

<!-- ===== 報酬画面 ===== -->
<div id="rewardScreen">

  <div id="rewardTitle"></div>

  <div id="rewardMessage"></div>

  <div id="rewardAnimation"></div>

  <button id="rewardClose"
    onclick="closeReward()">
    結果を見る
  </button>

</div>
<!-- ===== 報酬画面ここまで ===== -->  

<hr>

<p><b>認識結果</b></p>
<p id="result"></p>

<p><b>得点</b></p>
<p id="score"></p>

<p><b>不足語</b></p>
<p id="missing"></p>  

<script>
const GAS_URL =
"https://script.google.com/macros/s/AKfycbxwBG5iTHcJH6E3EHDC3HfkVj308wThVSiJt6fItum-7_o3H11IHYD6M_cpB_HO9WLM/exec";

let ORDER_TOLERANCE = 3;

let TIME_LIMIT = 60;  


let timerInterval = null;
let remainingTime = 0;

// 残り時間を画面に表示
function updateTimerDisplay() {

  const minutes = Math.floor(remainingTime / 60);
  const seconds = remainingTime % 60;

  const display =
    String(minutes).padStart(2, "0") + ":" +
    String(seconds).padStart(2, "0");

  document.getElementById("timer").innerText =
    "残り時間：" + display;
}


// カウントダウン開始
function startCountdown() {

  clearInterval(timerInterval);

  remainingTime = Number(TIME_LIMIT);

  updateTimerDisplay();

  timerInterval = setInterval(function() {

    remainingTime--;

    updateTimerDisplay();

    // 残り時間が0になったら録音終了
    if (remainingTime <= 0) {

      clearInterval(timerInterval);
      timerInterval = null;

      stopRecording();

    }

  }, 1000);

}
  

// ★ 録音用の変数
let mediaRecorder;
let audioChunks = [];
let recordingStartTime = "";

let recognition;
let recognitionText = "";
let stopRequested = false;

window.onload = function(){

  fetch(GAS_URL)
    .then(r => r.json())
    .then(data => {

      ORDER_TOLERANCE = data.orderTolerance;

      TIME_LIMIT = data.timeLimit || 60;

      document.getElementById("question")
        .innerText = data.questions[0];

    })
    .catch(err => {
      alert("取得エラー: " + err);
    });

};
// 半角英数字のみを許可
function checkHalfWidth(input) {

  const value = input.value;

  // 半角英数字以外が含まれているか確認
  if (/[^a-zA-Z0-9]/.test(value)) {

    alert("半角英数字で入力してください。");

    // 半角英数字以外を削除
    input.value = value.replace(/[^a-zA-Z0-9]/g, "");
  }
}


function startRecognition(){

  // すでに録音中なら、録音終了処理へ
  if (mediaRecorder && mediaRecorder.state === "recording") {
    stopRecording();
    return;
  }

  // 受験者情報の入力チェック
  const studentClass =
    document.getElementById("studentClass").value.trim();

  const studentNumber =
    document.getElementById("studentNumber").value.trim();

  const studentName =
    document.getElementById("studentName").value.trim();

  if (!studentClass || !studentNumber || !studentName) {
    alert("クラス・出席番号・氏名をすべて入力してください。");
    return;
  }

  // 初期化
  audioChunks = [];
  recognitionText = "";
  stopRequested = false;

  document.getElementById("result").innerText = "";
  document.getElementById("score").innerText = "";
  document.getElementById("missing").innerText = "";

  document.getElementById("recordButton").innerText = "録音中";

  // 録音開始
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {

      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        audioChunks.push(e.data);
      };

      mediaRecorder.start();

      startCountdown();

      // 録音開始時刻
      recordingStartTime = new Date().toISOString();

      // 録音停止後の処理を設定
      attachOnStop();

      // ボタン表示を変更
      document.getElementById("recordButton").innerText = "録音終了";

      // 音声認識開始
      recognition = new webkitSpeechRecognition();

      recognition.lang = "en-US";
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = function(event) {

        let interimText = "";

        for (let i = event.resultIndex; i < event.results.length; i++) {

          const transcript = event.results[i][0].transcript;

          if (event.results[i].isFinal) {
            recognitionText += transcript + " ";
          } else {
            interimText += transcript;
          }
        }

        document.getElementById("result").innerText =
          recognitionText + interimText;

      };

      // 音声認識が途中で終了した場合
      recognition.onend = function() {

        // 受験者が録音終了を押していた場合
        if (stopRequested) {

          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }

          return;
        }

        // 録音中なら音声認識を再開
        if (mediaRecorder && mediaRecorder.state === "recording") {

          try {
            recognition.start();
          } catch (err) {
            console.log("音声認識再開エラー:", err);
          }

        }
      };

      recognition.start();

    })
    .catch(err => {

      document.getElementById("recordButton").innerText = "録音開始";

      alert("録音開始エラー: " + err);

    });

}


// 手動で録音を終了する
function stopRecording() {

  if (!mediaRecorder || mediaRecorder.state !== "recording") {
    return;
  }
  clearInterval(timerInterval);
timerInterval = null;

  stopRequested = true;

  document.getElementById("recordButton").innerText = "終了処理中";

  // 音声認識を終了する
  if (recognition) {

    try {
      recognition.stop();
    } catch (err) {
      // 音声認識がすでに終了している場合
      if (mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }
    }

  } else {

    mediaRecorder.stop();

  }

}


// ★ 録音停止後：音声を base64 にして saveResult に渡す
// ここは startRecognition の外に置く


function setupRecorderOnStop() {
  if (!mediaRecorder) return;

  mediaRecorder.onstop = () => {

// 録音終了時刻を取得
const recordingEndTime = new Date().toISOString();

// 採点する
gradeReading(recognitionText.trim());

// 得点を取得
const score =
  parseInt(
    document.getElementById("score").innerText,
    10
  ) || 0;

// 得点に応じた報酬画面を表示
showReward(score);

    // 録音終了：ボタンの表示を元に戻す
    document.getElementById("recordButton").innerText = "録音開始";

    const blob = new Blob(audioChunks, { type: "audio/webm" });
    const reader = new FileReader();

    reader.onloadend = () => {
      const audioBase64 = reader.result.split(",")[1];

      const recognitionText =
        document.getElementById("result").innerText;

      const scoreText =
        document.getElementById("score").innerText;

      const score =
        parseInt(scoreText, 10) || 0;

      const missingText =
        document.getElementById("missing").innerText;

      const missingWords =
        missingText ? missingText.split(", ").filter(w => w) : [];

      // 録音終了時刻も一緒に送信
      saveResult(
        recognitionText,
        score,
        missingWords,
        audioBase64,
        recordingEndTime,
        recordingStartTime
      );
    };

    reader.readAsDataURL(blob);
  };
}



// MediaRecorder が作られたタイミングで onstop を設定するためのヘルパー
// startRecognition 内の getUserMedia 成功後に呼ぶ
function attachOnStop() {
  if (!mediaRecorder) return;
  setupRecorderOnStop();
}

function gradeReading(spoken){

const correct =
document.getElementById("question")
.innerText;

const correctWords =
normalize(correct);

const spokenWords =
normalize(spoken);

const lcsInfo =
getLCSInfo(
correctWords,
spokenWords
);

const levenshteinInfo =
getLevenshteinInfo(
  correctWords,
  spokenWords
);
const fixedEdits =
fixWordOrder(
    levenshteinInfo.edits
);

const score =
Math.round(
lcsInfo.lcsLength /
correctWords.length *100
);

const missingWords =
findMissingWords(
correctWords,
spokenWords
);

document.getElementById("score")
.innerText = score + " 点";

document.getElementById("missing")
.innerText =
missingWords.join(", ");

// ★ ここでは saveResult を呼ばない
// 録音停止後（mediaRecorder.onstop）で audioBase64 と一緒に送信する

}

function saveResult(
  recognitionText,
  score,
  missingWords,
  audioBase64,
  recordingEndTime
){

  fetch(GAS_URL,{

    method:"POST",

    body:JSON.stringify({

      studentClass:
        document.getElementById(
          "studentClass"
        ).value,

      studentNumber:
        document.getElementById(
          "studentNumber"
        ).value,

      studentName:
        document.getElementById(
          "studentName"
        ).value,

      question:
        document.getElementById(
          "question"
        ).innerText,

      recognition:
        recognitionText,

      score:
        score,

           missing:
        missingWords.join(", "),

      // 録音終了時刻
      recordingEndTime: recordingEndTime,
      // 録音開始時刻
recordingStartTime: recordingStartTime,

      audioBase64: audioBase64

    })

  })
  .then(r=>r.text())
  .then(data=>{
    alert("返答=" + data);
  })
  .catch(err=>{
    alert("失敗=" + err);
  });

}

function normalize(text){

return text
.toLowerCase()
.replace(/[.,!?]/g,"")
.trim()
.split(/\s+/);

}

function getLCSInfo(correctWords, spokenWords){

  const m = correctWords.length;
  const n = spokenWords.length;

  const dp = [];

  for(let i=0;i<=m;i++){

    dp[i]=[];

    for(let j=0;j<=n;j++){

      dp[i][j]=0;

    }

  }

  for(let i=1;i<=m;i++){

    for(let j=1;j<=n;j++){

      if(correctWords[i-1]===spokenWords[j-1]){

        dp[i][j]=dp[i-1][j-1]+1;

      }else{

        dp[i][j]=Math.max(
          dp[i-1][j],
          dp[i][j-1]
        );

      }

    }

  }

  const matched=[];

  let i=m;
  let j=n;

  while(i>0 && j>0){

    if(correctWords[i-1]===spokenWords[j-1]){

      matched.unshift({

        correct:i-1,

        spoken:j-1,

        word:correctWords[i-1]

      });

      i--;
      j--;

    }

    else if(dp[i-1][j]>=dp[i][j-1]){

      i--;

    }

    else{

      j--;

    }

  }

  return{

    lcsLength:dp[m][n],

    matched:matched

  };

}
function getLevenshteinInfo(correctWords, spokenWords){

  const m = correctWords.length;
  const n = spokenWords.length;

  const dp = [];

  for(let i=0;i<=m;i++){

    dp[i]=[];

    for(let j=0;j<=n;j++){

      if(i===0){

        dp[i][j]=j;

      }

      else if(j===0){

        dp[i][j]=i;

      }

      else{

        dp[i][j]=0;

      }

    }

  }

  for(let i=1;i<=m;i++){

    for(let j=1;j<=n;j++){

      const cost =
        (correctWords[i-1]===spokenWords[j-1])
        ?0
        :1;

      dp[i][j]=Math.min(

        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+cost

      );

    }

  }

const edits = [];

let i = m;
let j = n;

while(i > 0 || j > 0){

  if(
    i > 0 &&
    j > 0 &&
    correctWords[i-1] === spokenWords[j-1]
  ){

    edits.unshift({
      type:"MATCH",
      word:correctWords[i-1]
    });

    i--;
    j--;

  }

  else if(
    i > 0 &&
    j > 0 &&
    dp[i][j] === dp[i-1][j-1] + 1
  ){

    edits.unshift({
      type:"REPLACE",
      from:correctWords[i-1],
      to:spokenWords[j-1]
    });

    i--;
    j--;

  }

  else if(
    i > 0 &&
    dp[i][j] === dp[i-1][j] + 1
  ){

    edits.unshift({
      type:"DELETE",
      word:correctWords[i-1]
    });

    i--;

  }

  else if(
    j > 0 &&
    dp[i][j] === dp[i][j-1] + 1
  ){

    edits.unshift({
      type:"INSERT",
      word:spokenWords[j-1]
    });

    j--;

  }

  else{

    if(i>0) i--;
    if(j>0) j--;

  }

}

return{
  distance:dp[m][n],
  edits:edits
};
} 

function fixWordOrder(edits){

  const result = [];

  const used = new Array(edits.length).fill(false);

  for(let i=0;i<edits.length;i++){

    if(used[i]) continue;

    const edit = edits[i];

    if(edit.type==="DELETE"){

      let editDistance = 0;
      let found = -1;

      for(let j=i+1;j<edits.length;j++){

        if(used[j]) continue;

        if(edits[j].type==="MATCH"){
          continue;
        }

        editDistance++;

        if(editDistance > ORDER_TOLERANCE){
          break;
        }

        if(
          edits[j].type==="INSERT" &&
          edits[j].word===edit.word
        ){
          found = j;
          break;
        }

      }

      if(found!=-1){

        result.push({
          type:"ORDER",
          word:edit.word,
          correctIndex:edit.correctIndex,
          spokenIndex:edits[found].spokenIndex
        });

        used[i]=true;
        used[found]=true;

        continue;

      }

    }

    if(!used[i]){
      result.push(edit);
    }

  }

  return result;

}  

function findMissingWords(correctWords, spokenWords){

  const m = correctWords.length;
  n = spokenWords.length;

  const dp = [];

  for(let i=0;i<=m;i++){

    dp[i]=[];

    for(let j=0;j<=n;j++){

      dp[i][j]=0;

    }

  }

  for(let i=1;i<=m;i++){

    for(let j=1;j<=n;j++){

      if(correctWords[i-1]===spokenWords[j-1]){

        dp[i][j]=dp[i-1][j-1]+1;

      }else{

        dp[i][j]=Math.max(
          dp[i-1][j],
          dp[i][j-1]
        );

      }

    }

  }

  const missing=[];

  let i=m;
  let j=n;

  while(i>0 && j>0){

    if(correctWords[i-1]===spokenWords[j-1]){

      i--;
      j--;

    }else if(dp[i-1][j]>=dp[i][j-1]){

      missing.unshift(correctWords[i-1]);
      i--;

    }else{

      j--;

    }

  }

  while(i>0){

    missing.unshift(correctWords[i-1]);
    i--;

  }

  return missing;

}

// ★ startRecognition の中で MediaRecorder が作られたあとに onstop を設定するため
// navigator.mediaDevices.getUserMedia の then の最後で呼ぶ
// （統合するときに、getUserMedia の then の中で attachOnStop() を呼んでください）

// ===== 花火・ファンファーレ・お花畑音声 =====

const fireworksSound =
  new Audio("fireworks-and-fireworks-in-the-city.mp3");

const fanfareSound =
  new Audio("ファンファーレ5.mp3");

// ★ お花畑BGMを追加
const flowerMeadowSound =
  new Audio("flower_meadow_bgm.mp3");

fireworksSound.volume = 0.8;
fanfareSound.volume = 0.8;
flowerMeadowSound.volume = 0.8;
  
// ===== 報酬画面の表示 =====

function showReward(score) {

  const screen = document.getElementById("rewardScreen");
  const title = document.getElementById("rewardTitle");
  const message = document.getElementById("rewardMessage");
  const animation = document.getElementById("rewardAnimation");

  // 前のアニメーションを停止
  clearInterval(Number(screen.dataset.fireworkTimer));
  clearInterval(Number(screen.dataset.rewardTimer));

  screen.dataset.fireworkTimer = "";
  screen.dataset.rewardTimer = "";

  screen.style.display = "block";
  animation.innerHTML = "";

  if (score >= 90) {

    // ===== 花火 =====

    // ===== 花火とファンファーレの再生 =====

    fireworksSound.currentTime = 0;

    fireworksSound.play().catch(error => {
      console.log("花火の音声を再生できませんでした", error);
    });

    // 1.5秒後にファンファーレ
    screen.dataset.fanfareTimer = setTimeout(() => {

      fanfareSound.currentTime = 0;

      fanfareSound.play().catch(error => {
        console.log("ファンファーレを再生できませんでした", error);
      });

    }, 1500);

    screen.className = "reward-firework";
    title.innerText = "PERFECT!!";
    message.innerText = "素晴らしい！！";

    const timer = setInterval(() => {

      const firework = document.createElement("div");
      firework.className = "firework";

      firework.style.left = Math.random() * 90 + 5 + "%";
      firework.style.top = Math.random() * 60 + 10 + "%";

      animation.appendChild(firework);

      setTimeout(() => firework.remove(), 1600);

    }, 400);

    screen.dataset.fireworkTimer = timer;

  } else if (score >= 60) {

    // ===== お花とちょうちょ =====

      // ★ お花畑BGMの再生
    flowerMeadowSound.currentTime = 0;

    flowerMeadowSound.play().catch(error => {
      console.log("お花畑BGMを再生できませんでした", error);
    });

    screen.className = "reward-flower";
    title.innerText = "GOOD JOB!";
    message.innerText = "よく頑張りました！";

    // 花を次々に登場させる
    const flowers = ["🌸", "🌷", "🌼", "🌺", "🌻"];

    const timer = setInterval(() => {

      const flower = document.createElement("div");

      flower.className = "flower";

      flower.innerText =
        flowers[Math.floor(Math.random() * flowers.length)];

      flower.style.left = Math.random() * 90 + "%";

      animation.appendChild(flower);

      setTimeout(() => flower.remove(), 6500);

    }, 400);

    screen.dataset.rewardTimer = timer;

    // ちょうちょを飛ばす
    const butterflyTimer = setInterval(() => {

      const butterfly = document.createElement("div");

      butterfly.className = "butterfly";
      butterfly.innerText = "🦋";

      butterfly.style.left = "5%";
      butterfly.style.top = Math.random() * 60 + 15 + "%";

      animation.appendChild(butterfly);

      setTimeout(() => butterfly.remove(), 7500);

    }, 1200);

    screen.dataset.butterflyTimer = butterflyTimer;

 } else {

    // ===== 木枯らし =====

    screen.className = "reward-wind";
    title.innerText = "KEEP TRYING!";
    message.innerText = "次はもっと頑張ろう！";

    // 枯れ葉を次々に飛ばす
    const leaves = ["🍂", "🍁", "🍂", "🍃"];

    const timer = setInterval(() => {

      const leaf = document.createElement("div");

      leaf.className = "witheredLeaf";

      leaf.innerText =
        leaves[Math.floor(Math.random() * leaves.length)];

      leaf.style.left = Math.random() * 90 + "%";

      animation.appendChild(leaf);

      setTimeout(() => leaf.remove(), 5500);

    }, 300);

    screen.dataset.rewardTimer = timer;

  }

}


// ===== 報酬画面を閉じる =====

function closeReward() {

  const screen = document.getElementById("rewardScreen");

    // 効果音を停止
  clearTimeout(Number(screen.dataset.fanfareTimer));

  fireworksSound.pause();
  fireworksSound.currentTime = 0;

  fanfareSound.pause();
  fanfareSound.currentTime = 0;

  clearInterval(Number(screen.dataset.fireworkTimer));
  clearInterval(Number(screen.dataset.rewardTimer));
  clearInterval(Number(screen.dataset.butterflyTimer));

  screen.dataset.fireworkTimer = "";
  screen.dataset.rewardTimer = "";
  screen.dataset.butterflyTimer = "";

  screen.style.display = "none";

  document.getElementById("rewardAnimation").innerHTML = "";

}
</script>
