<!DOCTYPE html>
<html>
<body>
  <h2>受験者情報</h2>

クラス<br>
<input id="studentClass" oninput="checkHalfWidth(this)">

出席番号<br>
<input id="studentNumber" oninput="checkHalfWidth(this)">

氏名<br>
<input id="studentName"><br><br>

<hr>

<h1>さあ音読！君のスコアは？ </h1>

<h3 id="question">
読み込み中...
</h3>


<button id="recordButton" onclick="startRecognition()">
録音開始
</button>


<hr>

<p><b>認識結果</b></p>
<p id="result"></p>

<p><b>得点</b></p>
<p id="score"></p>

<p><b>不足語</b></p>
<p id="missing"></p>  

<script>
const GAS_URL =
"https://script.google.com/macros/s/AKfycbxmqYLcOKdL0ZDS7bVtYWqyM7mFKU6DaYC0emN-QaOQ5Xk9aoti27XiOiYbG6Th7tMI/exec";

let ORDER_TOLERANCE = 3;

// ★ 録音用の変数
let mediaRecorder;
let audioChunks = [];
let recordingStartTime = "";

window.onload = function(){

  fetch(GAS_URL)
    .then(r => r.json())
    .then(data => {

      ORDER_TOLERANCE = data.orderTolerance;

      document.getElementById("question")
        .innerText = data.questions[0];

    })
    .catch(err => {
      alert("取得エラー: " + err);
    });

};
// 半角英数字のみを許可
function checkHalfWidth(input) {

  const value = input.value;

  // 半角英数字以外が含まれているか確認
  if (/[^a-zA-Z0-9]/.test(value)) {

    alert("半角英数字で入力してください。");

    // 半角英数字以外を削除
    input.value = value.replace(/[^a-zA-Z0-9]/g, "");
  }
}


function startRecognition(){
    // 受験者情報の入力チェック
  const studentClass =
    document.getElementById("studentClass").value.trim();

  const studentNumber =
    document.getElementById("studentNumber").value.trim();

  const studentName =
    document.getElementById("studentName").value.trim();

  if (!studentClass || !studentNumber || !studentName) {
    alert("クラス・出席番号・氏名をすべて入力してください。");
    return;
  }

  // 録音ボタンの表示を変更
  document.getElementById("recordButton").innerText = "録音中";

  // 音声認識開始
  const recognition = new webkitSpeechRecognition();
  recognition.lang = "en-US";
  recognition.start();

  // 録音開始
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        audioChunks.push(e.data);
      };

      mediaRecorder.start();

// 録音開始時刻を取得
recordingStartTime = new Date().toISOString();

attachOnStop();
    })
    .catch(err => {
      // 録音開始に失敗した場合、ボタンを元に戻す
      document.getElementById("recordButton").innerText = "録音開始";
      alert("録音開始エラー: " + err);
    });

  recognition.onresult = function(event){

    const spoken =
      event.results[0][0].transcript;

    document.getElementById("result")
      .innerText = spoken;

    gradeReading(spoken);

    // 認識が終わったら録音停止
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
    }
  };

}


// ★ 録音停止後：音声を base64 にして saveResult に渡す
// ここは startRecognition の外に置く


function setupRecorderOnStop() {
  if (!mediaRecorder) return;

  mediaRecorder.onstop = () => {

        // 録音終了時刻を取得
const recordingEndTime = new Date().toISOString();

    // 録音終了：ボタンの表示を元に戻す
    document.getElementById("recordButton").innerText = "録音開始";

    const blob = new Blob(audioChunks, { type: "audio/webm" });
    const reader = new FileReader();

    reader.onloadend = () => {
      const audioBase64 = reader.result.split(",")[1];

      const recognitionText =
        document.getElementById("result").innerText;

      const scoreText =
        document.getElementById("score").innerText;

      const score =
        parseInt(scoreText, 10) || 0;

      const missingText =
        document.getElementById("missing").innerText;

      const missingWords =
        missingText ? missingText.split(", ").filter(w => w) : [];

      // 録音終了時刻も一緒に送信
      saveResult(
        recognitionText,
        score,
        missingWords,
        audioBase64,
        recordingEndTime,
        recordingStartTime
      );
    };

    reader.readAsDataURL(blob);
  };
}



// MediaRecorder が作られたタイミングで onstop を設定するためのヘルパー
// startRecognition 内の getUserMedia 成功後に呼ぶ
function attachOnStop() {
  if (!mediaRecorder) return;
  setupRecorderOnStop();
}

function gradeReading(spoken){

const correct =
document.getElementById("question")
.innerText;

const correctWords =
normalize(correct);

const spokenWords =
normalize(spoken);

const lcsInfo =
getLCSInfo(
correctWords,
spokenWords
);

const levenshteinInfo =
getLevenshteinInfo(
  correctWords,
  spokenWords
);
const fixedEdits =
fixWordOrder(
    levenshteinInfo.edits
);

const score =
Math.round(
lcsInfo.lcsLength /
correctWords.length *100
);

const missingWords =
findMissingWords(
correctWords,
spokenWords
);

document.getElementById("score")
.innerText = score + " 点";

document.getElementById("missing")
.innerText =
missingWords.join(", ");

// ★ ここでは saveResult を呼ばない
// 録音停止後（mediaRecorder.onstop）で audioBase64 と一緒に送信する

}

function saveResult(
  recognitionText,
  score,
  missingWords,
  audioBase64,
  recordingEndTime
){

  fetch(GAS_URL,{

    method:"POST",

    body:JSON.stringify({

      studentClass:
        document.getElementById(
          "studentClass"
        ).value,

      studentNumber:
        document.getElementById(
          "studentNumber"
        ).value,

      studentName:
        document.getElementById(
          "studentName"
        ).value,

      question:
        document.getElementById(
          "question"
        ).innerText,

      recognition:
        recognitionText,

      score:
        score,

           missing:
        missingWords.join(", "),

      // 録音終了時刻
      recordingEndTime: recordingEndTime,
      // 録音開始時刻
recordingStartTime: recordingStartTime,

      audioBase64: audioBase64

    })

  })
  .then(r=>r.text())
  .then(data=>{
    alert("返答=" + data);
  })
  .catch(err=>{
    alert("失敗=" + err);
  });

}

function normalize(text){

return text
.toLowerCase()
.replace(/[.,!?]/g,"")
.trim()
.split(/\s+/);

}

function getLCSInfo(correctWords, spokenWords){

  const m = correctWords.length;
  const n = spokenWords.length;

  const dp = [];

  for(let i=0;i<=m;i++){

    dp[i]=[];

    for(let j=0;j<=n;j++){

      dp[i][j]=0;

    }

  }

  for(let i=1;i<=m;i++){

    for(let j=1;j<=n;j++){

      if(correctWords[i-1]===spokenWords[j-1]){

        dp[i][j]=dp[i-1][j-1]+1;

      }else{

        dp[i][j]=Math.max(
          dp[i-1][j],
          dp[i][j-1]
        );

      }

    }

  }

  const matched=[];

  let i=m;
  let j=n;

  while(i>0 && j>0){

    if(correctWords[i-1]===spokenWords[j-1]){

      matched.unshift({

        correct:i-1,

        spoken:j-1,

        word:correctWords[i-1]

      });

      i--;
      j--;

    }

    else if(dp[i-1][j]>=dp[i][j-1]){

      i--;

    }

    else{

      j--;

    }

  }

  return{

    lcsLength:dp[m][n],

    matched:matched

  };

}
function getLevenshteinInfo(correctWords, spokenWords){

  const m = correctWords.length;
  const n = spokenWords.length;

  const dp = [];

  for(let i=0;i<=m;i++){

    dp[i]=[];

    for(let j=0;j<=n;j++){

      if(i===0){

        dp[i][j]=j;

      }

      else if(j===0){

        dp[i][j]=i;

      }

      else{

        dp[i][j]=0;

      }

    }

  }

  for(let i=1;i<=m;i++){

    for(let j=1;j<=n;j++){

      const cost =
        (correctWords[i-1]===spokenWords[j-1])
        ?0
        :1;

      dp[i][j]=Math.min(

        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1]+cost

      );

    }

  }

const edits = [];

let i = m;
let j = n;

while(i > 0 || j > 0){

  if(
    i > 0 &&
    j > 0 &&
    correctWords[i-1] === spokenWords[j-1]
  ){

    edits.unshift({
      type:"MATCH",
      word:correctWords[i-1]
    });

    i--;
    j--;

  }

  else if(
    i > 0 &&
    j > 0 &&
    dp[i][j] === dp[i-1][j-1] + 1
  ){

    edits.unshift({
      type:"REPLACE",
      from:correctWords[i-1],
      to:spokenWords[j-1]
    });

    i--;
    j--;

  }

  else if(
    i > 0 &&
    dp[i][j] === dp[i-1][j] + 1
  ){

    edits.unshift({
      type:"DELETE",
      word:correctWords[i-1]
    });

    i--;

  }

  else if(
    j > 0 &&
    dp[i][j] === dp[i][j-1] + 1
  ){

    edits.unshift({
      type:"INSERT",
      word:spokenWords[j-1]
    });

    j--;

  }

  else{

    if(i>0) i--;
    if(j>0) j--;

  }

}

return{
  distance:dp[m][n],
  edits:edits
};
} 

function fixWordOrder(edits){

  const result = [];

  const used = new Array(edits.length).fill(false);

  for(let i=0;i<edits.length;i++){

    if(used[i]) continue;

    const edit = edits[i];

    if(edit.type==="DELETE"){

      let editDistance = 0;
      let found = -1;

      for(let j=i+1;j<edits.length;j++){

        if(used[j]) continue;

        if(edits[j].type==="MATCH"){
          continue;
        }

        editDistance++;

        if(editDistance > ORDER_TOLERANCE){
          break;
        }

        if(
          edits[j].type==="INSERT" &&
          edits[j].word===edit.word
        ){
          found = j;
          break;
        }

      }

      if(found!=-1){

        result.push({
          type:"ORDER",
          word:edit.word,
          correctIndex:edit.correctIndex,
          spokenIndex:edits[found].spokenIndex
        });

        used[i]=true;
        used[found]=true;

        continue;

      }

    }

    if(!used[i]){
      result.push(edit);
    }

  }

  return result;

}  

function findMissingWords(correctWords, spokenWords){

  const m = correctWords.length;
  n = spokenWords.length;

  const dp = [];

  for(let i=0;i<=m;i++){

    dp[i]=[];

    for(let j=0;j<=n;j++){

      dp[i][j]=0;

    }

  }

  for(let i=1;i<=m;i++){

    for(let j=1;j<=n;j++){

      if(correctWords[i-1]===spokenWords[j-1]){

        dp[i][j]=dp[i-1][j-1]+1;

      }else{

        dp[i][j]=Math.max(
          dp[i-1][j],
          dp[i][j-1]
        );

      }

    }

  }

  const missing=[];

  let i=m;
  let j=n;

  while(i>0 && j>0){

    if(correctWords[i-1]===spokenWords[j-1]){

      i--;
      j--;

    }else if(dp[i-1][j]>=dp[i][j-1]){

      missing.unshift(correctWords[i-1]);
      i--;

    }else{

      j--;

    }

  }

  while(i>0){

    missing.unshift(correctWords[i-1]);
    i--;

  }

  return missing;

}

// ★ startRecognition の中で MediaRecorder が作られたあとに onstop を設定するため
// navigator.mediaDevices.getUserMedia の then の最後で呼ぶ
// （先生が統合するときに、getUserMedia の then の中で attachOnStop() を呼んでください）
</script>

</body>
</html>
